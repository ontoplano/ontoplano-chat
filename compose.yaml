services:
  chat:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      - ollama
      - speaches
    environment:
      ONTOPLANO_CHAT_CONFIG: /run/secrets/ontoplano-chat-config
    command: ['sh', '-c', 'node bin/ontoplano-chat.mjs models && exec node bin/ontoplano-chat.mjs serve']
    ports:
      - '127.0.0.1:1497:1497'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    secrets:
      - source: chat-config
        target: ontoplano-chat-config
    volumes:
      - chat-data:/home/node/.local/share/ontoplano-chat
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1497/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  chat-data:
  ollama-models:
  speech-models:

secrets:
  chat-config:
    file: ./compose.config.toml
